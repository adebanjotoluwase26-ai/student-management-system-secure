<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Results</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            width: 92%;
            max-width: 750px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .back-button {
            padding: 12px 20px;
            margin-bottom: 20px;
            border: none;
            border-radius: 6px;
            background: #555;
            color: white;
            cursor: pointer;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            min-height: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Manage Results</h1>
        <p>The Ambassadors School, Ota</p>
    </header>

    <main>

        <button
            type="button"
            class="back-button"
            onclick="window.location.href='admin-dashboard.html'">
            ← Back to Dashboard
        </button>

        <section class="card">

            <h2>Enter Student Result</h2>

            <form id="resultForm">

                <label for="studentId">
                    Student
                </label>

                <select id="studentId" required>
                    <option value="">
                        Select Student
                    </option>
                </select>


                <label for="subject">
                    Subject
                </label>

                <select id="subject" required>

                    <option value="">
                        Select Subject
                    </option>

                    <option value="Mathematics">
                        Mathematics
                    </option>

                    <option value="English">
                        English
                    </option>

                    <option value="Civic Education">
                        Civic Education
                    </option>

                    <option value="Biology">
                        Biology
                    </option>

                    <option value="Chemistry">
                        Chemistry
                    </option>

                    <option value="Physics">
                        Physics
                    </option>

                    <option value="Further Mathematics">
                        Further Mathematics
                    </option>

                    <option value="Government">
                        Government
                    </option>

                    <option value="Literature-in-English">
                        Literature-in-English
                    </option>

                    <option value="History">
                        History
                    </option>

                    <option value="CRS">
                        CRS
                    </option>

                    <option value="Economics">
                        Economics
                    </option>

                    <option value="Financial Accounting">
                        Financial Accounting
                    </option>

                    <option value="Commerce">
                        Commerce
                    </option>

                    <option value="Book Keeping">
                        Book Keeping
                    </option>

                    <option value="Marketing">
                        Marketing
                    </option>

                </select>


                <div class="form-row">

                    <div>
                        <label for="ca">
                            CA (0 - 40)
                        </label>

                        <input
                            type="number"
                            id="ca"
                            min="0"
                            max="40"
                            required
                        >
                    </div>

                    <div>
                        <label for="exam">
                            Exam (0 - 60)
                        </label>

                        <input
                            type="number"
                            id="exam"
                            min="0"
                            max="60"
                            required
                        >
                    </div>

                </div>


                <label for="term">
                    Term
                </label>

                <select id="term" required>

                    <option value="">
                        Select Term
                    </option>

                    <option value="First Term">
                        First Term
                    </option>

                    <option value="Second Term">
                        Second Term
                    </option>

                    <option value="Third Term">
                        Third Term
                    </option>

                </select>


                <label for="session">
                    Session
                </label>

                <select id="session" required>

                    <option value="">
                        Select Session
                    </option>

                    <option value="2025/2026">
                        2025/2026
                    </option>

                    <option value="2026/2027">
                        2026/2027
                    </option>

                    <option value="2027/2028">
                        2027/2028
                    </option>

                    <option value="2028/2029">
                        2028/2029
                    </option>

                    <option value="2029/2030">
                        2029/2030
                    </option>

                </select>


                <button type="submit">
                    Record Result
                </button>

            </form>

            <p id="message"></p>

        </section>

    </main>

    <script src="config.js"></script>
    <script src="admin-results.js"></script>

</body>

</html>
