<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
        }

        main {
            width: 92%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .welcome-card,
        .profile-card,
        .actions-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .welcome-card h2 {
            margin-top: 0;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .info-box {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 8px;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .action-button {
            padding: 25px 15px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .action-button:hover {
            opacity: 0.9;
        }

        .logout-button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #555;
            color: white;
            cursor: pointer;
        }

        #message {
            color: #666;
        }

        @media (max-width: 700px) {

            .profile-grid,
            .action-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1>Student Portal</h1>

        <p>
            The Ambassadors School, Ota
        </p>

    </header>


    <main>


        <!-- Welcome -->

        <section class="welcome-card">

            <h2>
                Welcome, <span id="studentName">Student</span>
            </h2>

            <p id="message">
                Loading your information...
            </p>

            <button
                type="button"
                class="logout-button"
                id="logoutButton">

                Logout

            </button>

        </section>


        <!-- Profile -->

        <section class="profile-card">

            <h2>My Profile</h2>

            <div class="profile-grid">

                <div class="info-box">

                    <strong>
                        Student ID
                    </strong>

                    <span id="studentId">
                        -
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        Full Name
                    </strong>

                    <span id="fullName">
                        -
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        Class
                    </strong>

                    <span id="studentClass">
                        -
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        Email
                    </strong>

                    <span id="studentEmail">
                        -
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        Gender
                    </strong>

                    <span id="studentGender">
                        -
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        Phone Number
                    </strong>

                    <span id="studentPhone">
                        -
                    </span>

                </div>

            </div>

        </section>


        <!-- Actions -->

        <section class="actions-card">

            <h2>My School Information</h2>

            <div class="action-grid">

                <button
                    type="button"
                    class="action-button"
                    onclick="window.location.href='student-attendance.html'">

                    📅
                    <br><br>
                    My Attendance

                </button>


                <button
                    type="button"
                    class="action-button"
                    onclick="window.location.href='student-results.html'">

                    📝
                    <br><br>
                    My Results

                </button>

            </div>

        </section>


    </main>

    <script src="config.js"></script>
    <script src="student-dashboard.js"></script>

</body>

</html>
