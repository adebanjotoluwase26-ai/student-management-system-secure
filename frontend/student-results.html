<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Results</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            width: 92%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .results-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .student-info {
            margin-bottom: 20px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .summary-box {
            background: #f7f7f7;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
        }

        .summary-box strong {
            display: block;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #f1f1f1;
        }

        .navigation {
            margin-top: 25px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
        }

        @media (max-width: 700px) {
            .summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Results</h1>
        <p>The Ambassadors School, Ota</p>
    </header>

    <main>

        <section class="results-card">

            <h2>Academic Results</h2>

            <div class="student-info">
                <p id="studentId">Student ID: Loading...</p>
            </div>

            <div class="summary">

                <div class="summary-box">
                    <strong id="subjectCount">0</strong>
                    Subjects
                </div>

                <div class="summary-box">
                    <strong id="totalMarks">0</strong>
                    Total Marks
                </div>

                <div class="summary-box">
                    <strong id="averageMark">0%</strong>
                    Average
                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>S/N</th>
                            <th>Subject</th>
                            <th>CA</th>
                            <th>Exam</th>
                            <th>Total</th>
                            <th>Grade</th>
                            <th>Term</th>
                            <th>Session</th>
                        </tr>
                    </thead>

                    <tbody id="resultsTable">
                    </tbody>

                </table>

            </div>

            <p id="message">
                Loading results...
            </p>


            <div class="navigation">

                <button
                    type="button"
                    onclick="window.location.href='student-dashboard.html'">
                    ← Back to Dashboard
                </button>

            </div>

        </section>

    </main>

    <script src="config.js"></script>
    <script src="student-results.js"></script>

</body>

</html>
