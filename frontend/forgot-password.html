<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;

            margin-top: 20px;

            border: none;
            border-radius: 6px;

            background: #222;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            The Ambassadors School, Ota
        </p>


        <form id="forgotPasswordForm">

            <label for="studentId">
                Student ID
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="e.g. STU-2026-004"
            >


            <p style="text-align: center;">
                OR
            </p>


            <label for="email">
                Registered Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
            >


            <button type="submit">
                Request Password Reset
            </button>

        </form>


        <p id="message"></p>


        <div class="links">

            <a href="login.html">
                ← Back to Login
            </a>

        </div>

    </div>

    <script src="config.js"></script>
    <script src="forgot-password.js"></script>

</body>

</html>
