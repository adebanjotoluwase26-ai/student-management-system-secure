<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .welcome-card,
        .action-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .action-button {
            padding: 25px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .action-button:hover {
            opacity: 0.9;
        }

        #adminName {
            font-weight: bold;
        }

        #message {
            color: #666;
        }

        #logoutButton {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #555;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Admin Dashboard</h1>
        <p>The Ambassadors School, Ota</p>
    </header>

    <main>

        <section class="welcome-card">

            <h2>
                Welcome, <span id="adminName">Administrator</span>
            </h2>

            <p id="message">
                Loading administrator information...
            </p>

            <button
                type="button"
                id="logoutButton">
                Logout
            </button>

        </section>


        <section class="action-card">

            <h2>Administration</h2>

            <div class="actions">

                <button
                    type="button"
                    class="action-button"
                    onclick="window.location.href='admin-students.html'">
                    👨‍🎓 Manage Students
                </button>

                <button
                    type="button"
                    class="action-button"
                    onclick="window.location.href='admin-attendance.html'">
                    📅 Manage Attendance
                </button>

                <button
                    type="button"
                    class="action-button"
                    onclick="window.location.href='admin-attendance-history.html'">
                    📋 Attendance History
                </button>

                <button
                    type="button"
                    class="action-button"
                    onclick="window.location.href='admin-results.html'">
                    📝 Manage Results
                </button>

                <button
                    type="button"
                    class="action-button"
                    onclick="window.location.href='admin-result-history.html'">
                    📋 Result History
                </button>

                <button
                    type="button"
                    class="action-button"
                    onclick="window.location.href='admin-student-records.html'">
                    📊 View Student Records
                </button>

            </div>

        </section>

    </main>

    <script src="config.js"></script>
    <script src="admin-dashboard.js"></script>

</body>
</html>
