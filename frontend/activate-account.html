<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Activate Student Account</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 20px;

            border: none;

            border-radius: 6px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;

            margin-top: 15px;

            min-height: 20px;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
            Activate Your Account
        </h1>

        <p class="subtitle">
            The Ambassadors School, Ota
        </p>


        <form id="activationForm">


            <label for="studentId">
                Student ID
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="e.g. STU-2026-004"
                required
            >


            <label for="activationCode">
                Activation Code
            </label>

            <input
                type="text"
                id="activationCode"
                placeholder="Enter your activation code"
                required
            >


            <label for="dob">
                Date of Birth
            </label>

            <input
                type="date"
                id="dob"
                required
            >


            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Create your login email"
                required
            >


            <label for="password">
                Create Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create your password"
                minlength="8"
                required
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="8"
                required
            >


            <button type="submit">
                Activate Account
            </button>

        </form>


        <p id="message"></p>


        <div class="login-link">

            <a href="login.html">
                Already activated? Login
            </a>

        </div>

    </div>

    <script src="config.js"></script>
    <script src="activate-account.js"></script>

</body>

</html>
